name: Build Photo Reminder APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhotoReminder-CloudBuild.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q PhotoReminder-CloudBuild-FIXED.zip -d project
          find project -name gradlew

      - name: Build APK
        run: |
          cd project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoReminder-APK
          path: project/**/build/outputs/apk/debug/*.apk
